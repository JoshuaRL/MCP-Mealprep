name: Verify and Publish Gateway to GHCR

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate offline contracts before building
        run: |
          bash -n startup.sh
          python3 -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Load a single-platform candidate. Publication below promotes this exact
      # tested local image; it must not rebuild after the protocol gate.
      - name: Build and load gateway candidate
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          target: mealprep
          platforms: linux/amd64
          load: true
          push: false
          tags: mealprep:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build optional bridge candidate (not published)
        run: docker build --target mcpo --tag mealprep:ci-mcpo .

      - name: Verify both real images and retain local evidence
        run: |
          python3 tests/release_check.py --image mealprep:ci --bridge-image mealprep:ci-mcpo \
            --output "$RUNNER_TEMP/mealprep-evidence"

      # Only summaries, never key files or raw request/container logs. Upload is
      # attempted on failed checks too; it does not make a failed gate successful.
      - name: Retain synthetic verification summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mealprep-verification-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/mealprep-evidence/summary.json
            ${{ runner.temp }}/mealprep-evidence/legacy/summary.json
            ${{ runner.temp }}/mealprep-evidence/optional/summary.json

      # Registry login and signing occur only after successful verification.
      # Existing main/manual publication policy is retained; PRs never publish.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested gateway image without rebuilding
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          expected=$(python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/mealprep-evidence/summary.json")); assert r["status"]=="passed"; print(r["gatewayImage"]["id"])')
          test "$(docker image inspect mealprep:ci --format '{{.Id}}')" = "$expected"
          test -n "$TAGS"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag mealprep:ci "$tag"
            docker push "$tag"
            # RepoDigests[0] carries the LOCAL tag's digest reference
            # (e.g. mealprep@sha256:...), which cosign would resolve
            # against Docker Hub. Sign the full GHCR repo@digest instead.
            remote=$(docker buildx imagetools inspect "$tag" | awk '/^Digest:/ {print $2}')
            test -n "$remote"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${remote}" >> "$RUNNER_TEMP/mealprep-published-digests.txt"
          done <<< "$TAGS"

      # Publish the read-only Baserow example image (pull-only deploy)
      # BEFORE any signing step, so a signing hiccup can never block the
      # second image from being published again.
      # Its Dockerfile pins the vendor commit and runs upstream tests in-build.
      - name: Build and publish Baserow image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: examples/baserow
          file: examples/baserow/Dockerfile
          platforms: linux/amd64
          load: false
          push: true
          # GHCR repository names must be lowercase; github.repository
          # preserves owner casing (JoshuaRL), which buildx rejects.
          tags: ghcr.io/joshuarl/mcp-mealprep:baserow-main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published gateway digest
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r reference; do
            test -n "$reference"
            cosign sign --yes "$reference"
          done < <(sort -u "$RUNNER_TEMP/mealprep-published-digests.txt")

      - name: Sign the published Baserow digest
        if: github.event_name != 'pull_request'
        env:
          REF: ghcr.io/joshuarl/mcp-mealprep:baserow-main
        run: cosign sign --yes "$REF"
