# Published-image stack: pulls the GHCR image produced from this repo's
# main branch by .github/workflows/docker-publish.yml. No host build, no
# source checkout needed to deploy. Select services explicitly — most
# legacy provider recipes remain unvalidated.
# Local development: override MEALPREP_IMAGE with your locally built tag.
x-runtime: &runtime
  image: ${MEALPREP_IMAGE:-ghcr.io/joshuarl/mcp-mealprep:main}
  pull_policy: always
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [mcp_network]
  secrets: [gateway_api_key]
  command: ["/app/startup.sh"]

x-auth: &auth
  MCP_API_KEY_FILE: /run/secrets/gateway_api_key

services:
  mcp-mealprep-everything:
    <<: *runtime
    ports: ["127.0.0.1:8081:8081"]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: everything
      MCP_PORT: 8081
      MCP_COMMAND_TYPE: npx
      MCP_PACKAGE: '@modelcontextprotocol/server-everything'

  mcp-mealprep-fetch:
    <<: *runtime
    ports: ["127.0.0.1:8082:8082"]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: fetch
      MCP_PORT: 8082
      MCP_COMMAND_TYPE: uvx
      MCP_PACKAGE: mcp-server-fetch

  mcp-mealprep-supabase:
    <<: *runtime
    ports: ["127.0.0.1:8083:8083"]
    secrets: [gateway_api_key, supabase_access_token]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: supabase
      MCP_PORT: 8083
      MCP_COMMAND_TYPE: npx
      MCP_PACKAGE: '@supabase/mcp-server-supabase'
      SUPABASE_ACCESS_TOKEN_FILE: /run/secrets/supabase_access_token
      MCP_ARGS: --read-only --project-ref ${SUPABASE_PROJECT_REF:-your_project_reference}

  mcp-mealprep-sequential-thinking:
    <<: *runtime
    ports: ["127.0.0.1:8084:8084"]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: sequential-thinking
      MCP_PORT: 8084
      MCP_COMMAND_TYPE: npx
      MCP_PACKAGE: '@modelcontextprotocol/server-sequential-thinking'

  mcp-mealprep-calculator:
    <<: *runtime
    ports: ["127.0.0.1:8085:8085"]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: calculator
      MCP_PORT: 8085
      MCP_COMMAND_TYPE: uvx
      MCP_PACKAGE: mcp-server-calculator

  mcp-mealprep-memory:
    <<: *runtime
    ports: ["127.0.0.1:8086:8086"]
    volumes: ["memory_data:/data/memory"]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: memory
      MCP_PORT: 8086
      MCP_COMMAND_TYPE: npx
      MCP_PACKAGE: '@modelcontextprotocol/server-memory'
      MEMORY_FILE_PATH: /data/memory/memory.jsonl

  mcp-mealprep-puppeteer:
    <<: *runtime
    ports: ["127.0.0.1:8087:8087"]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: puppeteer
      MCP_PORT: 8087
      MCP_COMMAND_TYPE: npx
      MCP_PACKAGE: '@modelcontextprotocol/server-puppeteer'

  mcp-mealprep-searxng:
    <<: *runtime
    ports: ["127.0.0.1:8088:8088"]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: searxng
      MCP_PORT: 8088
      MCP_COMMAND_TYPE: npx
      MCP_PACKAGE: mcp-searxng@2.10.0
      # JSON-enabled SearXNG only — see examples/searxng/README.md.
      SEARXNG_INSTANCE_URL: ${SEARXNG_INSTANCE_URL:-http://127.0.0.1:8888}

  mcp-mealprep-slack:
    <<: *runtime
    ports: ["127.0.0.1:8089:8089"]
    secrets: [gateway_api_key, slack_bot_token]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: slack
      MCP_PORT: 8089
      MCP_COMMAND_TYPE: npx
      MCP_PACKAGE: '@modelcontextprotocol/server-slack'
      SLACK_BOT_TOKEN_FILE: /run/secrets/slack_bot_token
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-your_team_id}

  mcp-mealprep-everart:
    <<: *runtime
    ports: ["127.0.0.1:8090:8090"]
    secrets: [gateway_api_key, everart_api_key]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: everart
      MCP_PORT: 8090
      MCP_COMMAND_TYPE: npx
      MCP_PACKAGE: '@modelcontextprotocol/server-everart'
      EVERART_API_KEY_FILE: /run/secrets/everart_api_key

  mcp-mealprep-gmaps:
    <<: *runtime
    ports: ["127.0.0.1:8091:8091"]
    secrets: [gateway_api_key, google_maps_api_key]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: gmaps
      MCP_PORT: 8091
      MCP_COMMAND_TYPE: npx
      MCP_PACKAGE: '@modelcontextprotocol/server-google-maps'
      GOOGLE_MAPS_API_KEY_FILE: /run/secrets/google_maps_api_key

  mcp-mealprep-brave-search:
    <<: *runtime
    ports: ["127.0.0.1:8092:8092"]
    secrets: [gateway_api_key, brave_api_key]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: brave-search
      MCP_PORT: 8092
      MCP_COMMAND_TYPE: npx
      MCP_PACKAGE: '@modelcontextprotocol/server-brave-search'
      BRAVE_API_KEY_FILE: /run/secrets/brave_api_key

  mcp-mealprep-aws-kb-retrieval:
    <<: *runtime
    ports: ["127.0.0.1:8093:8093"]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: aws-kb-retrieval
      MCP_PORT: 8093
      MCP_COMMAND_TYPE: uvx
      MCP_PACKAGE: mcp-server-aws-kb-retrieval

  # No Docker socket mount is supplied: granting daemon access is consequential.
  mcp-mealprep-docker:
    <<: *runtime
    ports: ["127.0.0.1:8094:8094"]
    environment:
      <<: *auth
      MCP_SERVER_TYPE: docker
      MCP_PORT: 8094
      MCP_COMMAND_TYPE: uvx
      MCP_PACKAGE: mcp-server-docker

  # Read-only Baserow example (see examples/baserow/README.md). Own image,
  # own secrets; does not share the gateway key or startup.sh contract.
  mcp-mealprep-baserow:
    image: ${BASEROW_MCP_IMAGE:-ghcr.io/joshuarl/mcp-mealprep:baserow-main}
    pull_policy: always
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    tmpfs: [/tmp]
    environment:
      HOME: /tmp
    ports: ["127.0.0.1:7317:7317"]
    networks: [mcp_network]
    secrets:
      - source: baserow_json
        target: baserow.json
      - source: mcp_bearer
        target: mcp.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7317/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

secrets:
  gateway_api_key:
    file: ${MEALPREP_SECRET_DIR:-./secrets}/gateway_api_key
  baserow_json:
    file: ${BASEROW_SECRETS_DIR:-${MEALPREP_SECRET_DIR:-./secrets}}/baserow.json
  mcp_bearer:
    file: ${BASEROW_SECRETS_DIR:-${MEALPREP_SECRET_DIR:-./secrets}}/mcp.json
  supabase_access_token:
    file: ${MEALPREP_SECRET_DIR:-./secrets}/supabase_access_token
  slack_bot_token:
    file: ${MEALPREP_SECRET_DIR:-./secrets}/slack_bot_token
  everart_api_key:
    file: ${MEALPREP_SECRET_DIR:-./secrets}/everart_api_key
  google_maps_api_key:
    file: ${MEALPREP_SECRET_DIR:-./secrets}/google_maps_api_key
  brave_api_key:
    file: ${MEALPREP_SECRET_DIR:-./secrets}/brave_api_key

volumes:
  memory_data:

networks:
  mcp_network:
    driver: bridge
